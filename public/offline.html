<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passa a Régua — Offline</title>
    <meta name="theme-color" content="#4f46e5" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f9fafb;
        color: #111827;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
        line-height: 1;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #4f46e5;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 1rem;
        color: #6b7280;
        max-width: 28rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      .btn {
        display: inline-block;
        padding: 0.625rem 1.5rem;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="icon">📶</div>
    <h1>Você está offline</h1>
    <p>
      Sem conexão com a internet no momento.<br />
      As alterações feitas continuarão salvas e serão sincronizadas quando a rede voltar.
    </p>
    <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
  </body>
</html>
